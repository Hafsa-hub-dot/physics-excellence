</style></head><body><header><h1>رحلة التميز في الفيزياء</h1><span class="pill">وحدة الحرارة</span></header><main id="app"></main><footer>معلمة الفيزياء حفصة طيبي • تعلمي بثقة وتألقي بالعلم</footer><script>const pages={"47": [[1, "ماذا يحدث لدرجة الحرارة عندما تتحرك الجسيمات بشكل أسرع؟", "ترتفع درجة الحرارة؛ لأن متوسط الطاقة الحركية للجسيمات يزداد."], [2, "عرّف الطاقة الحرارية.", "هي مجموع طاقتي الحركة والوضع لجسيمات المادة."], [3, "صف كيف يرتبط تدفق الحرارة بدرجة الحرارة.", "تنتقل الحرارة من الجسم الأعلى درجة حرارة إلى الجسم الأقل حتى يتحقق الاتزان الحراري."], [4, "ما الفرق بين درجة الحرارة والحرارة؟", "درجة الحرارة مقياس لمتوسط الطاقة الحركية للجسيمات، أما الحرارة فهي طاقة تنتقل بسبب فرق درجة الحرارة."], [5, "قام أحد سياح مدينة الدوحة بضبط ثرموستات غرفته في الفندق على 68°F. لم يدرك السائح أن الثرموستات يعمل بمقياس سيليزي بدلاً من فهرنهايت. أ. هل ستصبح غرفة الفندق ساخنة، أم باردة، أم مناسبة، بعد مرور ساعة أو ساعتين؟ ب. حوّل درجة الحرارة التي ضبط عليها الثرموستات بوحدة الفهرنهايت.", "أ. ستكون الغرفة ساخنة جدًا؛ لأن الجهاز مضبوط على 68°C بدلًا من 68°F. ب. درجة الضبط تعادل 154.4°F."], [6, "كيف تتغير الطاقة الحركية العشوائية للجزيئات عند تسخين دورق ماء؟", "تزداد الطاقة الحركية المتوسطة للجزيئات، وتصبح حركتها أسرع."], [7, "أيّ من درجتي الحرارة 1°F أم 1°C تمثّل فرقًا أكبر في درجة الحرارة؟", "فرق 1°C أكبر؛ لأنه يساوي فرق 1.8°F."], [8, "ضُبط مكيّف هواء غرفة على وضع التبريد عند درجة حرارة 76°F. حوّل درجة الحرارة تلك إلى درجة سيليزية.", "T_C = (5/9) × (76 − 32) = 24.44°C تقريبًا."], [9, "سافر سائح من مدينة الدوحة إلى نيويورك، فعلم من التلفاز أن درجة الحرارة في نيويورك 35 درجة دون أن يتم ذكر إن كانت هذه الدرجة بمقياس °C أو °F. هل درجة الحرارة هذه ساخنة أم باردة على المقياسين؟ اشرح إجابتك.", "35°C جو حار نسبيًا، أما 35°F فتعادل نحو 1.67°C وهي باردة."], [10, "صف حالة يحدث فيها انتقال للحرارة.", "عند وضع ملعقة باردة في كوب شاي ساخن تنتقل الحرارة من الشاي إلى الملعقة."], [11, "لماذا يزداد حجم إطارات السيارات بعدما تتحرك السيارة لمسافة طويلة؟", "ترتفع درجة حرارة الهواء داخل الإطار بسبب الحركة والاحتكاك؛ فيزداد ضغطه وقد يتمدد الإطار قليلًا."], [12, "قم بإجراء التحويلات بين مقاييس درجات الحرارة الآتية: أ. حوّل 1000 K إلى °C. ب. حوّل 72°F إلى °C. ج. حوّل −10°C إلى K. د. حوّل 77 K إلى °C.", "أ. 726.85°C. ب. 22.22°C. ج. 263.15 K. د. −196.15°C."]], "60": [[1, "ما الحرارة اللازمة لرفع درجة حرارة 3 kg من الألومنيوم بمقدار 10°C؟ (استخدم الجدول 2-2)", "Q = mcΔT. باستخدام c للألومنيوم ≈ 900 J/(kg·°C): Q = 3 × 900 × 10 = 27000 J. تحقق من قيمة الجدول في نسختك."], [2, "تكون الرمال في يوم مشمس ساخنة جدًا، وتصبح باردة في الليل. هل تمتلك الرمال سعة حرارية نوعية مرتفعة أم منخفضة؟ فسّر اختيارك.", "منخفضة نسبيًا؛ فتتغير درجة حرارتها بسرعة عند اكتساب الحرارة أو فقدها."], [3, "لدينا مادتان مختلفتان لهما نفس الكتلة، وعند إضافة كمية متساوية من الطاقة الحرارية نحصل على نتائج مختلفة في ارتفاع درجة الحرارة، فسّر ذلك.", "تختلف السعة الحرارية النوعية بين المادتين؛ عند تساوي Q وm تكون ΔT أكبر للمادة ذات c الأصغر."], [4, "ثلاث كرات فلزية، كرة من الألومنيوم وكرة من النحاس وكرة من الرصاص، كتلة كل منها 30 g، وُضعت في وعاء كبير من الماء الساخن لعدة دقائق. استخدم الجدول 2-2 للحصول على الحرارة النوعية لكل مادة. أ. أيّ من الكرات ستبلغ درجة الحرارة الأعلى؟ ب. أيّ من الكرات تمتلك الطاقة الحرارية الأكبر؟", "أ. جميع الكرات تبلغ درجة حرارة الماء نفسها بعد الاتزان الحراري. ب. الألومنيوم يكتسب أكبر كمية من الحرارة إذا كانت درجات البداية متساوية؛ أما الطاقة الحرارية الكلية فلا يمكن الجزم بها من السعة النوعية وحدها."], [5, "تتميز مناطق اليابسة القريبة من المحيطات أو المسطحات المائية الكبيرة في الغالب بامتلاكها مناخًا بمدى محدود من درجة الحرارة. فسّر ذلك.", "للماء سعة حرارية نوعية كبيرة، فيمتص ويطلق كميات كبيرة من الحرارة مع تغير طفيف في درجة حرارته."], [6, "ترتفع درجة حرارة إناء من النحاس من 27°C إلى 30°C. هل سنحتاج إلى الحرارة الكامنة أم إلى السعة الحرارية النوعية من أجل حساب الحرارة التي امتصها إناء النحاس؟", "السعة الحرارية النوعية؛ لأن درجة الحرارة تتغير دون تغير حالة المادة."], [7, "عندما نضع مكعبًا من الألومنيوم كتلته 30 kg ودرجة حرارته 0°C في كأس معزولة فيها 1 kg من الماء عند درجة حرارة 10°C، فسّر لماذا لا يحدث الاتزان الحراري لهما عند درجة 5°C.", "لأن السعتين الحراريتين الكليتين مختلفتان: mc للماء لا تساوي mc للألومنيوم، فلا يلزم أن تكون درجة الاتزان متوسط الدرجتين."], [8, "تبلغ الحرارة الكامنة لتبخر الماء 2,430,000 J/kg. احسب الطاقة الحرارية اللازمة لتحويل 2 kg من الماء إلى بخار عند درجة حرارة 100°C.", "Q = mL_v = 2 × 2430000 = 4860000 J."], [9, "ما الفرق بين الحرارة الكامنة للانصهار والحرارة الكامنة للتبخير؟", "الأولى تخص التحول بين الصلب والسائل، والثانية تخص التحول بين السائل والغاز."], [10, "ما الحرارة اللازمة لانصهار 0.5 kg من البازلاء المجمدة عند درجة حرارة 0°C؟ بافتراض أن البازلاء المجمدة تمتلك الخصائص الفيزيائية نفسها التي يمتلكها الماء. استخدم الجدول 4-2 للحصول على البيانات التي تساعدك في الحل.", "Q = mL_f. باستخدام L_f للماء ≈ 334000 J/kg: Q = 0.5 × 334000 = 167000 J. تحقق من قيمة الجدول في الكتاب."]], "64": [[6, "يمتلك الجسم A سعة حرارية نوعية أكبر بمرتين من الجسم B. تعرض الجسمان لكمية الحرارة نفسها من لهب شمعة. أي من العبارات الآتية صحيحة؟ أ. الجسم A أسخن من الجسم B. ب. الجسم B أسخن من الجسم A. ج. الجسمان A وB لهما نفس درجة الحرارة. د. لا يمكن الإجابة دون أن نعرف كتلة كل من الجسمين.", "د. لا يمكن الجزم دون معرفة الكتلتين ودرجتي الحرارة الابتدائيتين؛ فارتفاع الحرارة يعتمد على Q وm وc."], [7, "أي من درجتي الحرارة الآتيتين تعد الأسخن، 40°C أم 100°F؟", "40°C أسخن؛ لأن 100°F = 37.78°C."], [8, "طلب منك معلم الفيزياء تسخين مادة إلى أن تبلغ درجة حرارة 165°F. كم ستكون قراءة مقياس درجة الحرارة هذه وفق المقياس السيليزي؟", "T_C = (5/9) × (165 − 32) = 73.89°C."], [9, "سُجّلت درجة حرارة مساء أحد الأيام 20°C، لترتفع وتصبح في اليوم التالي 25°C. أ. كم يبلغ ارتفاع درجة الحرارة بوحدة الكلفن؟ ب. كم يبلغ ارتفاع درجة الحرارة بوحدة الفهرنهايت؟", "أ. فرق الحرارة 5 K. ب. فرق الحرارة 9°F."], [10, "هل دُوّنت درجة الحرارة في كل من الحالات الآتية بشكل صحيح (هل هي ممكنة فيزيائيًا ويُستخدم فيها التدوين الصحيح)، أم أنها غير صحيحة؟ فسّر إجابتك. أ. −722.1°F. ب. −25 K. ج. 230.0°C. د. 293°K.", "أ. غير ممكنة لأنها أدنى من الصفر المطلق (−459.67°F). ب. غير ممكنة لأن الكلفن لا يكون سالبًا. ج. صحيحة. د. التدوين غير صحيح: 293 K دون علامة الدرجة."], [11, "يوضح الشكل (24-2) توزيع الجزيئات لنفس المادة عند درجتي حرارة مختلفتين. أ. أي الشكلين له درجة حرارة أعلى؟ ب. حدد اتجاه تدفق الحرارة بين الشكلين. ج. متى يحدث الاتزان الحراري بين الجسمين؟", "أ. لا يمكن تحديد أي الشكلين أعلى درجة حرارة من عدد الجزيئات وتباعدها فقط؛ يلزم معرفة متوسط طاقتها الحركية. ب. تنتقل الحرارة من الأعلى درجة حرارة إلى الأقل، ولا يمكن تحديد اتجاهها بين (a) و(b) من الرسم وحده. ج. يتحقق الاتزان الحراري عند تساوي درجتي حرارتهما."]], "65": [[12, "منذ أكثر من قرن مضى، اعتاد الناس استخدام زجاجات الماء الساخن في تدفئة ملابسهم قبل التسلق. لماذا لم يستخدموا الأجسام الفلزية الساخنة المماثلة في الكتلة بدلًا من ذلك؟", "الماء ذو سعة حرارية نوعية مرتفعة، فيخزن طاقة حرارية أكبر لكل كتلة وتغير درجة حرارة مماثلين."], [13, "كيف تفسّر السعة الحرارية النوعية للفلزات أنها الأنسب للاستخدام في أواني الطهي؟", "تسخن كثير من الفلزات بسرعة بسبب سعتها الحرارية النوعية المنخفضة نسبيًا، كما تساعد موصليتها الحرارية العالية في نقل الحرارة للطعام."], [14, "لماذا تثبت قيمة درجة الحرارة عندما تتغير حالة المادة؟", "لأن الطاقة المكتسبة أو المفقودة أثناء التحول تُستخدم في تغيير طاقة الوضع بين الجسيمات لا في زيادة متوسط طاقتها الحركية."], [15, "وضع أحد الطلاب 2 kg من الماء الذي تبلغ درجة حرارته 20°C في الموقد. السعة الحرارية للماء c = 4184 J/kg°C. يزود الموقد الماء بطاقة حرارية مقدارها 502,080 J. ما درجة الحرارة القصوى التي سيبلغها الماء نتيجة تسخينه بهذه الطاقة؟", "ΔT = Q/(mc) = 502080/(2×4184) = 60°C؛ T النهائية = 20+60 = 80°C."], [16, "أضاف أحد الطلاب 502,050 J من الطاقة إلى كمية من الماء السعة الحرارية للماء 4184 J/kg°C لتسخينه من درجة حرارة 20°C إلى درجة حرارة 60°C. ما كتلة هذه الكمية من الماء؟", "m = Q/(cΔT) = 502050/(4184×40) ≈ 3.00 kg."], [17, "هل يمكنك حساب السعة الحرارية النوعية باستخدام ورقة ألومنيوم من المطبخ؟ أ. اكتب الخطوات والإجراءات المناسبة. ب. هل سيعطي هذا الإجراء إجابة مضبوطة؟ قدّم إجابتك في الحالتين.", "أ. قِس كتلة الرقاقة، وقدّم لها طاقة حرارية معلومة، وقِس تغير حرارتها، ثم استخدم Q=mcΔT. ب. الدقة محدودة بسبب فقد الحرارة وصغر الكتلة وصعوبة قياس درجة حرارتها."], [18, "كيف تساعد الحرارة الكامنة لانصهار الماء في تلطيف درجة حرارة الهواء المحيط بمسطح مائي كبير، كالبحيرات والأنهار والبرك المائية والبحار؟", "عند التجمد يطلق الماء حرارة كامنة، وعند انصهار الجليد يمتص حرارة، ما يخفف تغير حرارة الوسط المحيط."], [19, "الجدول التالي يوضح السعة الحرارية النوعية لثلاث مواد افتراضية تم استخدام كتل متساوية من المواد الثلاث عند نفس درجة الحرارة (درجة حرارة الغرفة). تم تسخين المواد الثلاثة في نفس الوقت بمصدر لهب متماثل. أ. بعد مرور 5 min من التسخين أي المواد ترتفع درجة حرارتها أعلى؟ ب. أي المواد يحتاج إلى وقت أقل للوصول إلى نفس درجة الحرارة نفسها؟ ج. أي المواد يمتلك محتوى حراري أكبر عند الوصول لنفس درجة الحرارة؟ د. ما مقدار الطاقة الحرارية اللازمة لرفع درجة حرارة 0.4 kg من المادة B من 20°C إلى 80°C؟", "السعات: A=2000، B=900، C=1200 J/(kg·°C). أ. B. ب. B. ج. المادة A تحتاج أكبر كمية حرارة للوصول إلى درجة الحرارة نفسها من البداية نفسها، لكن لا يمكن الجزم بأن طاقتها الداخلية الكلية هي الأكبر دون معلومات إضافية. د. Q = 0.4 × 900 × (80 − 20) = 21600 J."]]};

const detail={
'47-1':['تذكري أن درجة الحرارة تقيس متوسط الطاقة الحركية للجسيمات.','إذا أصبحت الجسيمات أسرع في حركتها، يزداد متوسط طاقتها الحركية؛ لذلك ترتفع درجة الحرارة.'],
'47-2':['نميز بين الطاقة الحرارية ودرجة الحرارة: الأولى ترتبط بالطاقة الكلية لجسيمات المادة، والثانية بمتوسط الطاقة الحركية.','تشمل الطاقة الحرارية مجموع طاقات حركة الجسيمات ووضعها في المادة وفق تعريف الدرس.'],
'47-3':['لا تسألي: أي الجسمين يحتوي حرارة أكثر؟ بل: أيهما أعلى درجة حرارة؟','تنتقل الحرارة تلقائيًا من الأعلى درجة حرارة إلى الأقل حتى تتساوى درجتا الحرارة.'],
'47-4':['درجة الحرارة تخبرنا عن متوسط حركة الجسيمات؛ أما الحرارة فهي طاقة أثناء انتقالها.','مثال: ينتقل قدر من الحرارة من كوب شاي ساخن إلى ملعقة أبرد.'],
'47-5':['الجهاز يعمل بالسيلسيوس؛ لذلك الرقم 68 يعني 68°C، وليس 68°F. هذه درجة شديدة الارتفاع للغرفة.','للتحويل إلى الفهرنهايت نستخدم قانون الكتاب:',{f:'T<sub>F</sub> = '+F('9','5')+' × T<sub>C</sub> + 32'},'نعوض عن T<sub>C</sub> بالقيمة 68:',{f:'T<sub>F</sub> = '+F('9','5')+' × 68 + 32 = 154.4°F'},'إذن الغرفة ساخنة جدًا، وقراءة الضبط تساوي 154.4°F.'],
'47-6':['عند التسخين تنتقل طاقة إلى الماء، فتزداد حركة الجزيئات العشوائية في المتوسط.','لا يعني ذلك أن جميع الجزيئات تتحرك بالسرعة نفسها؛ المقصود هو زيادة المتوسط.'],
'47-7':['درجة سيليزية واحدة تقابل 1.8 درجة فهرنهايت من حيث مقدار التغير.','إذن فرق 1°C أكبر من فرق 1°F.'],
'47-8':['المعطى: T<sub>F</sub> = 76°F، والمطلوب T<sub>C</sub>.',{f:'T<sub>C</sub> = '+F('5','9')+' (T<sub>F</sub> − 32)'},'نطرح 32 من 76 أولًا: 76 − 32 = 44.',{f:'T<sub>C</sub> = '+F('5 × 44','9')+' = '+F('220','9')+' ≈ 24.44°C'},'إذن درجة ضبط المكيف نحو 24.4°C.'],
'47-9':['الرقم 35 لا يكفي للحكم على الطقس؛ يجب معرفة وحدة القياس.','إذا كانت 35°C فهي مرتفعة نسبيًا. وإذا كانت 35°F نحولها:',{f:'T<sub>C</sub> = '+F('5','9')+' (35 − 32) = '+F('15','9')+' ≈ 1.67°C'},'إذن 35°F باردة، بينما 35°C حارة.'],
'47-10':['عند وضع ملعقة باردة في شاي ساخن يوجد فرق في درجة الحرارة.','تنتقل الحرارة من الشاي إلى الملعقة حتى يقتربا من الاتزان الحراري.'],
'47-11':['أثناء سير السيارة تسخن الإطارات والهواء المحبوس داخلها.','ارتفاع درجة حرارة الغاز قد يزيد ضغطه، وقد يسبب تمددًا طفيفًا للإطار المرن. لا يعني ذلك زيادة كمية الهواء.'],
'47-12':['أ. من الكلفن إلى السيليزي: نطرح 273.15.',{f:'T<sub>C</sub> = 1000 − 273.15 = 726.85°C'},'ب. من الفهرنهايت إلى السيليزي:',{f:'T<sub>C</sub> = '+F('5','9')+' (72 − 32) = '+F('200','9')+' ≈ 22.22°C'},'ج. من السيليزي إلى الكلفن: نضيف 273.15.',{f:'T<sub>K</sub> = −10 + 273.15 = 263.15 K'},'د. من الكلفن إلى السيليزي:',{f:'T<sub>C</sub> = 77 − 273.15 = −196.15°C'}],
'60-1':['نستخدم قانون السعة الحرارية النوعية لأن درجة الحرارة تتغير دون تغير حالة المادة.',{f:'Q = mcΔT'},'المعطيات: m = 3 kg، و ΔT = 10°C. باستخدام القيمة التقريبية للألومنيوم c = 900 J/(kg·°C):',{f:'Q = 3 × 900 × 10 = 27000 J'},'الإجابة 27000 J وفق القيمة التقريبية المذكورة؛ تُعتمد القيمة الموجودة في جدول الكتاب إذا اختلفت.'],
'60-2':['الرمال تسخن سريعًا نهارًا وتبرد سريعًا ليلًا.','هذا يعني أن مقدارًا محدودًا من الطاقة يغير درجة حرارتها بدرجة كبيرة؛ أي أن سعتها الحرارية النوعية منخفضة نسبيًا.'],
'60-3':['لدينا الكتلة نفسها والطاقة المكتسبة نفسها، لكن المادتين مختلفتان.',{f:'Q = mcΔT'},'عند ثبات Q وm: المادة ذات c الأصغر ترتفع حرارتها أكثر؛ والمادة ذات c الأكبر ترتفع حرارتها أقل.'],
'60-4':['أ. جميع الكرات في الماء الساخن نفسه مدة كافية؛ عند الاتزان الحراري تصل إلى درجة حرارة الماء نفسها.','ب. إذا بدأت الكرات بدرجة الحرارة نفسها وكانت كتلها متساوية، فإن الألومنيوم يكتسب حرارة أكثر لأنه ذو سعة حرارية نوعية أعلى.',{f:'Q = mcΔT'},'تنبيه: «الحرارة المكتسبة» أثناء التسخين ليست بالضرورة «الطاقة الحرارية الكلية» المخزنة في الجسم.'],
'60-5':['الماء يحتاج إلى كمية كبيرة من الطاقة حتى تتغير درجة حرارته.','لذلك يمتص حرارة نهارًا ويطلقها ليلًا ببطء، فيخفف تغير درجات حرارة المناطق الساحلية.'],
'60-6':['درجة حرارة النحاس تغيرت من 27°C إلى 30°C، ولم يذكر تغير في حالته.',{f:'ΔT = 30 − 27 = 3°C'},'نستخدم Q = mcΔT، لا قانون الحرارة الكامنة؛ فالحرارة الكامنة تُستخدم عند تغير الحالة.'],
'60-7':['المنتصف الحسابي بين 0°C و10°C هو 5°C، لكنه ليس بالضرورة درجة الاتزان.','لأن كتلة الألومنيوم كبيرة، ولأن السعة الحرارية النوعية للألومنيوم تختلف عن الماء، فلا تتساوى كمية الحرارة المفقودة والمكتسبة عند منتصف الدرجتين.','يجب مساواة الحرارة المفقودة من الماء بالحرارة المكتسبة من الألومنيوم، مع استخدام كتلة كل مادة وسعتها النوعية.'],
'60-8':['الماء عند درجة الغليان ويتحول إلى بخار؛ لا نحسب تغيرًا في درجة الحرارة.',{f:'Q = mL<sub>v</sub>'},'المعطيات: m = 2 kg و L<sub>v</sub> = 2430000 J/kg.',{f:'Q = 2 × 2430000 = 4860000 J'},'الإجابة: 4,860,000 جول.'],
'60-9':['الانصهار: تحول المادة من صلبة إلى سائلة عند درجة الانصهار.','التبخر: تحول المادة من سائلة إلى غازية.','لكل منهما حرارة كامنة نوعية مختلفة ورمز مختلف: L<sub>f</sub> للانصهار وL<sub>v</sub> للتبخر.'],
'60-10':['البازلاء المجمدة تُعامل في السؤال على أنها ماء مجمد عند 0°C.',{f:'Q = mL<sub>f</sub>'},'باستخدام القيمة التقريبية L<sub>f</sub> = 334000 J/kg:',{f:'Q = 0.5 × 334000 = 167000 J'},'الطاقة المطلوبة نحو 167000 جول. إن اختلفت قيمة الجدول في الكتاب، استخدميها.'],
'64-6':['السعة الحرارية النوعية وحدها لا تكفي لتحديد أي الجسمين أسخن.',{f:'Q = mcΔT'},'عند تساوي Q، يعتمد مقدار تغير الحرارة على حاصل ضرب m × c. كما نحتاج لمعرفة درجات البداية للحكم على درجة الحرارة النهائية.','الإجابة الصحيحة: د.'],
'64-7':['نحول 100°F إلى السيليزي حتى نقارن بوحدة واحدة.',{f:'T<sub>C</sub> = '+F('5','9')+' (100 − 32) = '+F('340','9')+' ≈ 37.78°C'},'نقارن 37.78°C مع 40°C: إذن 40°C أعلى.'],
'64-8':['المعطى: 165°F، والمطلوب: °C.',{f:'T<sub>C</sub> = '+F('5','9')+' (165 − 32)'},'أولًا: 165 − 32 = 133.',{f:'T<sub>C</sub> = '+F('5 × 133','9')+' = '+F('665','9')+' ≈ 73.89°C'},'إذن قراءة المقياس نحو 73.9°C.'],
'64-9':['الارتفاع في درجة الحرارة = 25 − 20 = 5 درجات سيليزية.','أ. فروق درجات الحرارة بالكلفن والسيليزي متساوية عدديًا: الزيادة 5 K.','ب. فرق الفهرنهايت يساوي فرق السيليزي مضروبًا في:',{f:F('9','5')+' × 5 = 9°F'},'لاحظي أننا نحسب «فرقًا»؛ لذلك لا نضيف 32.'],
'64-10':['أ. −722.1°F أقل من الصفر المطلق −459.67°F؛ غير ممكنة فيزيائيًا.','ب. −25 K غير ممكنة؛ فلا توجد درجات حرارة كلفن سالبة في هذا السياق.','ج. 230.0°C قيمة ممكنة وتدوينها صحيح.','د. 293°K تدوين غير صحيح؛ الصحيح 293 K بلا علامة درجة.'],
'64-11':['الرسم يبين عددًا وتوزيعًا مكانيًا للجزيئات، ولا يبين سرعاتها.','أ. لا يمكن تحديد أي الشكلين أعلى درجة حرارة من هذا الرسم وحده.','ب. لا يمكن تحديد اتجاه انتقال الحرارة بينهما دون معرفة أيهما أعلى درجة حرارة.','ج. يحدث الاتزان الحراري عندما تتساوى درجتا الحرارة، فيتوقف الانتقال الصافي للحرارة.'],
'65-12':['الماء ذو سعة حرارية نوعية عالية مقارنة بكثير من الفلزات.','عند الكتلة نفسها وفرق الحرارة نفسه، يمكن للماء تخزين طاقة أكبر وإطلاقها تدريجيًا، فيناسب التدفئة.'],
'65-13':['كثير من الفلزات ذات سعة حرارية نوعية منخفضة نسبيًا، فتسخن بسرعة.','كما أنها جيدة التوصيل للحرارة؛ فتساعد على توزيعها إلى الطعام. لا يكفي انخفاض السعة النوعية وحده لتفسير ملاءمتها للطهي.'],
'65-14':['خلال تغير الحالة، تذهب الطاقة المكتسبة أو المفقودة إلى تغيير ترتيب الجزيئات وطاقة وضعها.','لذلك يظل متوسط طاقتها الحركية، ومن ثم درجة حرارتها، ثابتًا أثناء التحول النقي عند ضغط ثابت.'],
'65-15':['المعطيات: m = 2 kg، و c = 4184 J/(kg·°C)، و Q = 502080 J، ودرجة البداية 20°C.',{f:'Q = mcΔT'},'نعزل فرق درجة الحرارة بقسمة الطرفين على mc:',{f:'ΔT = '+F('Q','mc')+' = '+F('502080','2 × 4184')+' = 60°C'},'نضيف الزيادة إلى درجة البداية:',{f:'T<sub>final</sub> = 20 + 60 = 80°C'},'الإجابة 80°C، وهي دون درجة الغليان المعتادة للماء.'],
'65-16':['المعطيات: Q = 502050 J، و c = 4184 J/(kg·°C)، ودرجة البداية 20°C والنهاية 60°C.',{f:'ΔT = 60 − 20 = 40°C'},'نكتب القانون ثم نعزل الكتلة:',{f:'Q = mcΔT'}, {f:'m = '+F('Q','cΔT')+' = '+F('502050','4184 × 40')+' ≈ 3.00 kg'},'إذن كتلة الماء نحو 3 kg.'],
'65-17':['أ. نزن ورقة الألومنيوم، ونقيس درجة حرارتها أولًا، ثم نزودها بطاقة حرارية معروفة ونقيس درجة الحرارة النهائية.',{f:'c = '+F('Q','mΔT')},'ب. النتيجة لن تكون مضبوطة بسهولة؛ فالرقاقة خفيفة جدًا وتفقد الحرارة بسرعة للهواء والأداة الحاملة.','لتحسين الدقة نستخدم عزلًا أفضل وقياسات دقيقة للطاقة والكتلة ودرجة الحرارة.'],
'65-18':['عند انصهار الجليد يمتص طاقة من الوسط المحيط دون ارتفاع فوري في درجة حرارته.','وعند تجمد الماء يطلق طاقة إلى الوسط المحيط.','هاتان العمليتان تساعدان على تقليل التغيرات السريعة في درجة حرارة الهواء حول المسطحات المائية.'],
'65-19':['السعات النوعية من الجدول: A = 2000، B = 900، C = 1200 J/(kg·°C).','أ. عند تسخين كتل متساوية بالطاقة نفسها، ترتفع درجة حرارة B أكثر لأن سعتها النوعية أصغر.','ب. B تحتاج أقل وقت للوصول إلى الزيادة نفسها في درجة الحرارة، إذا كان معدل اكتساب الطاقة متساويًا.','ج. المادة A تحتاج أكبر كمية من الحرارة للوصول إلى درجة الحرارة نفسها، ولكن لا نستنتج الطاقة الداخلية الكلية من ذلك وحده.','د. نكتب القانون:',{f:'Q = mcΔT'},'نحسب فرق درجة الحرارة: 80 − 20 = 60°C.',{f:'Q = 0.4 × 900 × 60 = 21600 J'},'الإجابة: 21600 جول.']

function el(tag,content='',cls=''){
 let e=document.createElement(tag);e.className=cls;
 // Keep each scientific value and its unit in one left-to-right isolate.
 const raw=String(content), token=/(?:[−-]?\d+(?:[.,]\d+)?\s*(?:°\s*[CF]|°\s*C|K|kg|g|J|°F|°C|\b°F\b|\b°C\b))|(?:[−-]?\d+(?:[.,]\d+)?\s*J\s*\/\s*\(?kg[^\s،؛]*\)?)/g;
 let last=0,m;
 while((m=token.exec(raw))!==null){
  if(m.index>last)e.append(document.createTextNode(raw.slice(last,m.index)));
  let isolate=document.createElement('bdi');isolate.className='science-ltr';isolate.dir='ltr';isolate.textContent=m[0];e.append(isolate);last=token.lastIndex;
 }
 if(last<raw.length)e.append(document.createTextNode(raw.slice(last)));
 return e;
}function add(tag,content='',cls='',parent=app){let e=el(tag,content,cls);parent.append(e);return e}function btn(label,fn,cls='action',parent=app){let e=add('button',label,cls,parent);e.onclick=fn;return e}function go(type,data={}){stack.push(screen);screen={type,...data};render();scrollTo(0,0)}function back(){if(stack.length){screen=stack.pop();render();scrollTo(0,0)}}function nav(){if(stack.length)btn('↩ رجوع إلى القائمة السابقة',back,'action back'); if(screen.type!=='home')btn('⌂ الرئيسية',()=>{stack.push(screen);screen={type:'home'};render();scrollTo(0,0)},'action back')}function tiles(items){let g=add('div','','grid');items.forEach(([name,fn])=>btn(name,fn,'tile',g))}function math(s){let d=add('div','','formula');d.innerHTML=s}function frac(a,b){return `<span class="frac"><span>${a}</span><span>${b}</span></span>`}

function renderMath(value){
 let t=String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
 t=t.replace(/\b(T|L)_([A-Za-z]+)\b/g,(_,base,sub)=>base+'<sub>'+sub+'</sub>');
 t=t.replace(/\((5|9)\s*\/\s*(9|5)\)/g,(_,a,b)=>'<span class="math-frac"><span class="math-num">'+a+'</span><span class="math-den">'+b+'</span></span>');
 t=t.replace(/\b(Q)\s*\/\s*\((mc|cΔT)\)/g,(_,a,b)=>'<span class="math-frac"><span class="math-num">'+a+'</span><span class="math-den">'+b+'</span></span>');
 t=t.replace(/(\d+)\s*\/\s*\(([^()]+)\)/g,(_,a,b)=>'<span class="math-frac"><span class="math-num">'+a+'</span><span class="math-den">'+b+'</span></span>');

}

let newGame=null,marathonLevel=0;

function newGameView(){let g=newGame;if(!g)return;let data=g.kind==='marathon'?marathonQuestions:easyQuestions;let i=g.ids[g.pos],q=data[i],easy=g.kind!=='marathon';let stage=challengeStage(easy?'easy':'marathon',easy?'أنتِ قدّ التحدي!':'ماراثون القوانين',easy?'أظهري تألقكِ… كل إجابة خطوة نحو القمة!':['المستوى الأول • انطلاقة الأبطال','المستوى الثاني • اكتشفي العلاقات','المستوى الثالث • تحدي المحترفات'][g.level]);let st=add('div','','marathon-stats',stage);add('span',`🎯 السؤال ${g.pos+1} من ${g.ids.length}`,'',st);add('span',`⭐ رصيدكِ: ${g.score}`,'',st);let pg=add('div','','progress',stage);let bar=add('div','','',pg);bar.style.width=(100*(g.pos+(g.selected!==null?1:0))/g.ids.length)+'%';add('div',q[0],'question',stage);let opts=add('div','','marathon-options',stage);q[1].forEach((value,n)=>{let b=btn('',()=>{if(g.selected!==null)return;g.selected=n;if(n===q[2])g.score++;else g.wrong.push(i);render()},'marathon-choice',opts);add('b','ABCD'[n],'',b);add('span',value,'',b);if(g.selected!==null){b.disabled=true;if(n===q[2])b.classList.add('correct');else if(n===g.selected)b.classList.add('wrong')}});if(g.selected!==null){let ok=g.selected===q[2];let feedback=add('div','','marathon-feedback',stage);add('strong',ok?'🌟 إجابة بطلة! أحسنتِ!':'💗 محاولة شجاعة! اكتشفي الفكرة الصحيحة','',feedback);add('p',q[3],'',feedback);if(ok)celebration(stage);btn(g.pos===g.ids.length-1?'🏆 اكتشفي نتيجتكِ':'🚀 إلى السؤال التالي',()=>{if(g.pos===g.ids.length-1){go('newResult')}else{g.pos++;g.selected=null;render()}},'action',stage)}else{add('p','✨ ركّزي، اختاري بثقة، وأكملي رحلتكِ نحو التميز!','challenge-encourage',stage)}}

function printSolutions(pageFilter=null,idFilter=null){
 const selected=Object.entries(pages).flatMap(([page,items])=>items.filter(item=>(pageFilter===null||page===String(pageFilter))&&(idFilter===null||item[0]===idFilter)).map(item=>({page,id:item[0],answer:item[2]})));

<script>
/* Keep numerical values and their units in one left-to-right island in RTL prose. */
(function(){
 const pattern=/(?:[−-]?\d[\d,.]*(?:\s*[×x]\s*\d[\d,.]*)?\s*(?:°\s*[CFK]|[℃℉]|\b(?:kg|g|mg|J|kJ|K|°C|°F|W|mL|min|s)\b))|(?:°\s*[CFK])/g;
 let busy=false;
 function fix(){
  if(busy)return;busy=true;
  try{
   const root=document.getElementById('app');if(!root)return;
   const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
   const targets=[];let node;
   while(node=walker.nextNode()){
    if(!node.nodeValue||!pattern.test(node.nodeValue)){pattern.lastIndex=0;continue}pattern.lastIndex=0;
    if(node.parentElement.closest('.physics-value,.formula,script,style,textarea,input'))continue;
    targets.push(node);
   }
   for(const textNode of targets){
    const raw=textNode.nodeValue,frag=document.createDocumentFragment();let last=0;
    for(const m of raw.matchAll(pattern)){
     if(m.index>last)frag.append(document.createTextNode(raw.slice(last,m.index)));
     const b=document.createElement('bdi');b.className='physics-value';b.dir='ltr';b.textContent=m[0].replace(/°\s+/g,'°');frag.append(b);last=m.index+m[0].length;
    }
    if(last<raw.length)frag.append(document.createTextNode(raw.slice(last)));
    textNode.replaceWith(frag);
   }
  }finally{busy=false}
 }
 const observer=new MutationObserver(()=>fix());
 const start=()=>{const root=document.getElementById('app');if(!root)return;observer.observe(root,{childList:true,subtree:true,characterData:true});fix()};
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
</script>
